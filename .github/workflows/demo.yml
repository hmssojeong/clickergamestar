name: Unity WebGL Build & Deploy

on:
  push:
    branches: [ web-build ]
  # 매일 아침 9시(한국 시간) 실행 스케줄 추가
  schedule:
    - cron: '0 0 * * *'
  # 수동으로도 실행할 수 있도록 버튼 추가 (테스트용)
  workflow_dispatch:

# GitHub Pages 배포에 필요한 권한
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    # 스케줄 실행 시, 지난 24시간 동안 커밋이 있었는지 확인하는 로직은 
    # 아래 steps 내에서 통합하여 관리하거나 전체 실행으로 유지합니다.
    
    steps:
      # 0. 디스크 공간 확보
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      # 1. 코드 가져오기
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # 이전 커밋과의 비교를 위해 전체 이력을 가져옵니다.

      # (선택 추가) 스케줄 실행 시 커밋 확인이 꼭 필요하다면 여기에 체크 단계를 둘 수 있습니다.

      # 2. 캐시 (빌드 속도 향상)
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-

      # 3. Unity 빌드
      - name: Build WebGL
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          # buildProfile: "Assets/Settings/Build Profiles/Web - Desktop - Release.asset"
          # 주의: buildProfile은 Unity 6 이상에서만 지원됩니다. 사용하지 않는 경우 주석 처리하세요.

      # 4. 빌드 결과물 업로드 (Artifact)
      - name: Upload Build
        uses: actions/upload-artifact@v4
        with:
          name: WebGL-Build
          path: build/WebGL

      # 5. GitHub Pages 배포 준비
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 6. Pages용 Artifact 업로드
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/WebGL/WebGL

      # 7. GitHub Pages 배포
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4

      # 8-0. 변경 내역 추출
      - name: Get Changelog
        if: success()
        id: Changelog
        run: |
          # 이전 배포(성공한 마지막 커밋)부터 현재까지의 로그를 한 줄씩 추출
          # %s는 커밋 메시지 본문입니다. (명령어 공백 수정)
          if [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ] && [ -n "${{ github.event.before }}" ]; then
            CHANGELOG=$(git log --pretty=format:"• %s" ${{ github.event.before }}..${{ github.sha }})
          else
            CHANGELOG=$(git log --pretty=format:"• %s" -10)
          fi

          # 슬랙 페이로드에 포함하기 위해 줄바꿈 처리 및 환경 변수 저장
          echo "logs<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      # 8. 슬랙 알림 (성공)
      - name: Slack Notification (Success)
        if: success()
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "✅ WebGL 빌드 & 배포 성공",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "✅ *${{ github.repository }}* 빌드 & 배포 완료!\n👤 작성자: ${{ github.actor }}\n🌐 <https://hamsso.itch.io/fruittree|Itch.io 플레이> | <https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/|GitHub Pages>"
                  }
                },
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*🚀 주요 업데이트 내역:*\n${{ steps.Changelog.outputs.logs || '변경 내역 없음' }}"
                  }
                }
              ]
            }

      # 9. 슬랙 알림 (실패)
      - name: Slack Notification (Failure)
        if: failure()
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "❌ WebGL 빌드 실패",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "🔥 *${{ github.repository }}* 빌드 실패!\n📝 커밋: ${{ github.event.head_commit.message }}\n👤 작성자: ${{ github.actor }}\n🔗 <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|로그 확인>"
                  }
                }
              ]
            }

      # 10. Itch.io 업로드 (GitHub Action 사용)
      - name: Deploy to Itch.io
        if: success()
        uses: manleydev/butler-publish-itchio-action@master
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          CHANNEL: web
          ITCH_GAME: fruittree
          ITCH_USER: hamsso
          PACKAGE: build/WebGL/WebGL
          VERSION: ${{ github.run_number }}